[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "waivphaet"
version = "0.1.0"
description = "Robustifying Phikon-v2 via registered-pair contrastive fine-tuning (a PHAET-class reproduction attempt)"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "Ryan Kim" }]

dependencies = [
    # cu128 wheels: this cluster's driver reports CUDA 12.8, and the default cu130
    # wheel fails CUDA init with "driver is too old". Install with
    #   --index-url https://download.pytorch.org/whl/cu128
    "torch==2.8.0",
    "torchvision==0.23.0",
    "h5py>=3.12",
    "numpy>=2.0",
    "transformers>=4.49",
    "peft>=0.14",
    "huggingface_hub>=0.28",
    "einops>=0.8",
    "tqdm>=4.66",
    "safetensors>=0.4",
    # Required only for timm-native backbones (paige-ai/Virchow2 and friends), which
    # AutoModel cannot load at all -- their config.json has no model_type. Not optional:
    # the loader branch in models/encoder.py imports it, so a venv built without it
    # ModuleNotFoundErrors the moment a timm backbone is named.
    "timm>=1.0.20",
]

[project.optional-dependencies]
# Diagnostic PLISM retrieval eval (see PLAN.md 1: PLISM is TRAINING data for us,
# so plismbench numbers are diagnostics only and are never leaderboard-comparable).
plism = ["owkin-plismbench"]
# PathoROB (PRIMARY metric) is cloned into third_party/, not pip-depended on -- but its
# FeatureDataManager, which we call to write embeddings, needs these.
pathorob = ["pandas>=2.2", "scikit-learn>=1.5", "matplotlib>=3.9", "seaborn>=0.13"]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
waiv-repack = "waivphaet.data.repack:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
markers = [
    "slow: builds a real multi-GB backbone on CPU; deselect with -m 'not slow'",
]

[tool.ruff]
line-length = 100
target-version = "py312"
