# Q8 ALL-DATA final (hoptimus): the selection recipe on all 91 conditions and all tissue
# cores, checkpoints every 25 steps to 200. Evaluate the step the slope
# rule picked on the matching selection run (picks: 100). Seed-free: submit with --seeds.
# generated by: python scripts/sweep/make_final.py --backbone hoptimus --picks 100
base: q8_selection.yaml
backbone: {name: hoptimus}
batch:
  heldout_scanners: []
  heldout_stains: []
  heldout_cores: []
optim: {stop_step: 200}
ckpt:
  every: 1000000000
  schedule: [25, 50, 75, 100, 125, 150, 175, 200]
  keep_last: 1
eval: {every: 1000000000, at_start: false}
run: {name: q8-final-hopt}
