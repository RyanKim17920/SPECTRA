# SPECTRA v2 recipe. As written this is the held-out SELECTION run: it trains on 72 of the 91
# PLISM conditions (scanner GT450 and stain MY held out) and on every tissue core except 7. The
# in-run PLISM eval scores the held-out cores under every condition every 25 steps; the R1 stop
# rule (scripts/sweep/select.py) picks the step with the highest score. The release model is
# this config on all data, stopped at that step (scripts/sweep/make_final.py).
#
#   python scripts/sweep/submit.py configs/v2/spectra_v2.yaml --sweep selection \
#       --seeds 1 -o backbone.name=uni2
backbone:
  name: uni2
  grad_checkpointing: true
adapt:                    # LoRA on every attention and MLP Linear of every block
  mode: lora
  lora_rank: 16
  lora_alpha: 32
  lora_dropout: 0.0
  lora_targets: both
heads:                    # loss = 0.5 InfoNCE(CLS head) + 0.5 InfoNCE(GeM head)
  - {pool: cls, weight: 0.5, proj_dim: 512, proj_hidden: 1024, proj_bn: true}
  - {pool: gem, weight: 0.5, proj_dim: 512, proj_hidden: 1024, proj_bn: true}
objective:                # symmetric grid InfoNCE, same-core negatives kept as plain negatives
  temperature: 0.1
batch:
  n_cond: 2               # C conditions per step
  n_tiles: 256            # T shared locations per step (224 px tiles)
  heldout_scanners: [GT450]
  heldout_stains: [MY]
  heldout_cores: [5, 12, 13, 35, 36, 38, 45]
  workers: 8
optim:
  lr: 1.0e-4
  weight_decay: 0.05
  warmup_steps: 200
  steps: 400              # cosine horizon
  stop_step: 250          # selection runs stop here; R1 picks within 25..250
  grad_clip: 1.0
ckpt:
  every: 25
  resume_every: 25
  keep_last: 0
  dtype: bfloat16
eval:
  every: 25
  at_start: true
  locations_per_core: 64
  bootstrap: 200
  exclude_conditions: [HRH_S60]
  readouts: [cls, clsmean]
  guard: auto
run:
  seed: 0
